services:
  postgres:
    image: postgres:18
    container_name: backendplayground-postgres
    environment:
      POSTGRES_DB: backendplayground
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: "@Lamehidepowerk7"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
